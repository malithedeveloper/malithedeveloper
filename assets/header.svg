<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">MALIDEV</title>
  <desc id="description">The MALIDEV logo formed from glowing white particles on a black particle field.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "MaliDev Logo";
        src: url("data:font/woff2;base64,") format("woff2");
        font-style: italic;
        font-weight: 700;
      }
      .logo-points { animation: shimmer 3.8s ease-in-out infinite; }
      .letter { animation: letter-drift var(--duration) ease-in-out infinite; }
      .field-a { animation: field-a 9s ease-in-out infinite; }
      .field-b { animation: field-b 12s ease-in-out infinite; }
      .spark-a { animation: spark 3.1s ease-in-out infinite; }
      .spark-b { animation: spark 4.7s ease-in-out infinite reverse; }
      .spark-c { animation: spark 6.2s ease-in-out infinite; }
      @keyframes letter-drift {
        0%,100% { transform:translate(0,0) }
        34% { transform:translate(var(--dx),var(--dy)) }
        71% { transform:translate(var(--dx2),var(--dy2)) }
      }
      @keyframes shimmer { 0%,100% { opacity:.82 } 50% { opacity:1 } }
      @keyframes field-a { 0%,100% { transform:translate(0,0) } 50% { transform:translate(5px,-3px) } }
      @keyframes field-b { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-4px,4px) } }
      @keyframes spark { 0%,100% { opacity:.14 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .letter,.logo-points,.field-a,.field-b,.spark-a,.spark-b,.spark-c { animation:none !important; }
      }
    </style>
    <pattern id="field-dots-a" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r=".8" fill="#e1e6eb" opacity=".28"/>
    </pattern>
    <pattern id="field-dots-b" width="68" height="68" patternUnits="userSpaceOnUse" patternTransform="translate(17 12)">
      <circle cx="4" cy="4" r="1.15" fill="#fff" opacity=".18"/>
    </pattern>
    <pattern id="logo-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.65" fill="#fff"/>
    </pattern>
    <mask id="logo-mask" maskUnits="userSpaceOnUse" x="70" y="45" width="820" height="175">
      <rect x="70" y="45" width="820" height="175" fill="#000"/>
      <g fill="#fff" font-family="MaliDev Logo, monospace" font-size="142"
        font-style="italic" font-weight="700">
        <g class="letter" style="--duration:6.1s;--dx:-3px;--dy:-7px;--dx2:2px;--dy2:4px"><text x="139" y="174">M</text></g>
        <g class="letter" style="--duration:6.8s;--dx:3px;--dy:5px;--dx2:-2px;--dy2:-6px"><text x="239" y="174">A</text></g>
        <g class="letter" style="--duration:7.4s;--dx:-2px;--dy:7px;--dx2:3px;--dy2:-4px"><text x="338" y="174">L</text></g>
        <g class="letter" style="--duration:6.5s;--dx:2px;--dy:-6px;--dx2:-3px;--dy2:5px"><text x="438" y="174">I</text></g>
        <g class="letter" style="--duration:7.1s;--dx:-3px;--dy:4px;--dx2:2px;--dy2:-7px"><text x="537" y="174">D</text></g>
        <g class="letter" style="--duration:6.3s;--dx:3px;--dy:-5px;--dx2:-2px;--dy2:6px"><text x="637" y="174">E</text></g>
        <g class="letter" style="--duration:7.7s;--dx:-2px;--dy:6px;--dx2:3px;--dy2:-5px"><text x="736" y="174">V</text></g>
      </g>
    </mask>
    <filter id="logo-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark-glow" x="-700%" y="-700%" width="1500%" height="1500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" fill="#020202"/>
  <rect class="field-a" x="-12" y="-12" width="984" height="284" fill="url(#field-dots-a)"/>
  <rect class="field-b" x="-12" y="-12" width="984" height="284" fill="url(#field-dots-b)"/>

  <g fill="#fff" filter="url(#spark-glow)">
    <circle class="spark-a" cx="69" cy="54" r="1.7"/>
    <circle class="spark-c" cx="106" cy="119" r="1.15"/>
    <circle class="spark-b" cx="151" cy="204" r="1.4"/>
    <circle class="spark-a" cx="209" cy="29" r="1.25"/>
    <circle class="spark-b" cx="282" cy="38" r="1.5"/>
    <circle class="spark-c" cx="330" cy="222" r="1.1"/>
    <circle class="spark-a" cx="391" cy="54" r="1.35"/>
    <circle class="spark-b" cx="447" cy="226" r="1.45"/>
    <circle class="spark-c" cx="506" cy="29" r="1.15"/>
    <circle class="spark-a" cx="568" cy="217" r="1.3"/>
    <circle class="spark-b" cx="628" cy="43" r="1.15"/>
    <circle class="spark-c" cx="691" cy="225" r="1.5"/>
    <circle class="spark-a" cx="742" cy="45" r="1.6"/>
    <circle class="spark-c" cx="793" cy="216" r="1.2"/>
    <circle class="spark-b" cx="871" cy="193" r="1.8"/>
    <circle class="spark-a" cx="917" cy="83" r="1.35"/>
    <circle class="spark-b" cx="931" cy="229" r="1.2"/>
    <circle class="spark-c" cx="38" cy="232" r="1.25"/>
  </g>

  <g filter="url(#logo-glow)">
    <rect class="logo-points" x="70" y="45" width="820" height="175" fill="url(#logo-dots)" mask="url(#logo-mask)"/>
  </g>
</svg>
