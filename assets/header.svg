<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">malidev</title>
  <desc id="description">Animated terminal-style header: building ideas into working systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0e"/>
      <stop offset="0.55" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9ff66"/>
      <stop offset="0.52" stop-color="#e8edf2"/>
      <stop offset="1" stop-color="#78aaff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8dc7ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8dc7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a9bdd4" stroke-opacity=".07"/>
      <circle cx="0" cy="0" r="1" fill="#b9ff66" fill-opacity=".13"/>
    </pattern>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#b9ff66" flood-opacity=".42"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminal-clip">
      <rect x="48" y="48" width="864" height="204" rx="13"/>
    </clipPath>
    <mask id="type-mask">
      <rect class="type-reveal" x="128" y="194" width="520" height="30" rx="2" fill="#fff"/>
    </mask>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .pulse-a { animation: pulse-a 3.4s ease-in-out infinite; }
      .pulse-b { animation: pulse-b 4.2s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .type-reveal { transform-origin: 128px 0; animation: type 9s steps(38, end) infinite; }
      .caret { animation: caret .9s steps(1, end) infinite; }
      .flow { animation: flow 5s linear infinite; }
      @keyframes pulse-a { 0%,100% { opacity:.3 } 50% { opacity:1 } }
      @keyframes pulse-b { 0%,100% { opacity:.9 } 55% { opacity:.25 } }
      @keyframes scan { from { transform:translateY(-30px) } to { transform:translateY(290px) } }
      @keyframes type { 0%,10% { transform:scaleX(0) } 46%,78% { transform:scaleX(1) } 90%,100% { transform:scaleX(0) } }
      @keyframes caret { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
      @keyframes flow { to { stroke-dashoffset:-60 } }
      @media (prefers-reduced-motion: reduce) {
        .pulse-a,.pulse-b,.scan,.type-reveal,.caret,.flow { animation:none !important; }
        .type-reveal { transform:scaleX(1); }
      }
    </style>
  </defs>

  <rect width="960" height="300" rx="18" fill="url(#background)"/>
  <rect width="960" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="730" cy="120" rx="285" ry="210" fill="url(#halo)"/>
  <path class="flow" d="M0 262C142 221 218 293 370 252S633 215 960 268" fill="none" stroke="url(#accent)" stroke-width="1.4" stroke-opacity=".28" stroke-dasharray="2 14"/>

  <g clip-path="url(#terminal-clip)">
    <rect x="48" y="48" width="864" height="204" rx="13" fill="#080c11" fill-opacity=".82" stroke="#8193a8" stroke-opacity=".25"/>
    <rect x="48" y="48" width="864" height="34" fill="#111720"/>
    <circle cx="68" cy="65" r="5" fill="#ff6b6b"/>
    <circle cx="86" cy="65" r="5" fill="#f4c95d"/>
    <circle cx="104" cy="65" r="5" fill="#79db75"/>
    <text class="mono" x="480" y="70" text-anchor="middle" font-size="11" fill="#8d9aaa">mali@dev: ~/build</text>

    <g opacity=".42" class="mono" font-size="10" fill="#7f91a6">
      <text x="687" y="109">01 0110 1001</text>
      <text x="730" y="126">1100 001 010</text>
      <text x="668" y="143">101 0011 1100</text>
      <text x="755" y="160">0110 101 01</text>
    </g>

    <text class="mono" x="88" y="118" font-size="13" fill="#7f91a6">$ whoami</text>
    <text class="mono" x="88" y="174" font-size="54" font-weight="700" letter-spacing="-3" fill="url(#accent)" filter="url(#glow)">malidev</text>
    <text class="mono" x="90" y="201" font-size="12" letter-spacing="2.2" fill="#93a2b4">SYSTEMS · STREAMS · EXPERIMENTS</text>

    <g mask="url(#type-mask)">
      <text class="mono" x="88" y="235" font-size="15" fill="#b9ff66">&gt;</text>
      <text class="mono" x="108" y="235" font-size="15" fill="#dfe8f2">building ideas into working systems</text>
      <rect class="caret" x="438" y="222" width="8" height="16" fill="#b9ff66"/>
    </g>

    <g fill="#b9ff66" filter="url(#soft-glow)">
      <circle class="pulse-a" cx="835" cy="115" r="2.5"/>
      <circle class="pulse-b" cx="866" cy="145" r="2"/>
      <circle class="pulse-a" cx="809" cy="178" r="1.8"/>
    </g>
    <path class="scan" d="M48 0H912" stroke="#b9ff66" stroke-opacity=".12"/>
  </g>

  <rect x="48.5" y="48.5" width="863" height="203" rx="12.5" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
</svg>
